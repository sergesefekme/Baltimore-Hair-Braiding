version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Vite 7 needs Node ^20.19 || >=22.12 — pin it rather than trusting
        # whatever the build image defaults to.
        - nvm install 22
        - nvm use 22
        - node -v
        # The app is not at the repo root. --prefix avoids depending on
        # whether `cd` persists between Amplify phases.
        - npm ci --prefix website
    build:
      commands:
        - npm run build --prefix website
  artifacts:
    # No vite.config.js, so outDir is the default: website/dist
    baseDirectory: website/dist
    files:
      - '**/*'
  cache:
    paths:
      - website/node_modules/**/*
